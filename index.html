<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle & Wellness Tracker</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">

        <!-- VIEW 1: DASHBOARD -->
        <section id="view-dashboard" class="view-section active">
            <h2 class="page-title">Dashboard</h2>

            <!-- Overview Ring Card -->
            <div class="card">
                <div class="overview-ring-container">
                    <div id="current-phase" class="phase-badge">Loading...</div>
                    <div id="current-day" class="days-countdown">-</div>
                    <div class="cycle-subtext">Current Cycle Status</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <span>Next Period</span>
                        <strong id="next-period-date">-</strong>
                    </div>
                    <div class="stat-box">
                        <span>Fertile Window</span>
                        <strong id="ovulation-window">-</strong>
                    </div>
                </div>
            </div>

            <!-- Daily Wellness Tip -->
            <div id="tips-card" class="card" style="background: var(--purple-light); border-color: rgba(139,92,246,0.15);">
                <h3 style="font-size: 0.95rem; color: var(--purple); margin-bottom: 6px;">💡 Daily Wellness Tip</h3>
                <p id="phase-tips-content" style="font-size: 0.85rem; color: #475569; line-height: 1.4;">Loading tips...</p>
            </div>

            <!-- Quick Logging Form -->
            <div class="card">
                <h3 style="font-size: 1rem; margin-bottom: 14px; color: #1e293b;">Log Today's Update</h3>
                <form id="period-form">
                    <div class="form-group">
                        <label id="date-label">Action / Date</label>
                        <select id="action-type">
                            <option value="daily">📝 Log Daily Check-in (Symptoms & Mood)</option>
                            <option value="start">🩸 Log Period Start Date</option>
                            <option value="end">🏁 Log Period End Date</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Select Date</label>
                        <input type="date" id="single-date" required>
                    </div>

                    <div class="form-group">
                        <label>Flow Intensity</label>
                        <select id="flow-intensity">
                            <option value="">-- None / N/A --</option>
                            <option value="Spotting">Spotting</option>
                            <option value="Light">Light</option>
                            <option value="Normal">Normal</option>
                            <option value="Heavy">Heavy</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Cramps / Body Pain</label>
                        <select id="symptom-severity">
                            <option value="Mild / None">Mild / None</option>
                            <option value="Moderate">Moderate</option>
                            <option value="Severe">Severe</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Mood</label>
                        <select id="mood-select">
                            <option value="Calm & Balanced">Calm & Balanced 🌸</option>
                            <option value="Happy">Happy 😊</option>
                            <option value="Anxious / Stressed">Anxious / Stressed 🌧️</option>
                            <option value="Irritable">Irritable ⚡</option>
                            <option value="Fatigued">Fatigued 😴</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Other Symptoms (comma separated)</label>
                        <input type="text" id="symptoms-input" placeholder="e.g., headache, bloating">
                    </div>

                    <button type="submit" id="submit-btn" class="btn-primary">Save Entry</button>
                </form>
            </div>
        </section>

        <!-- VIEW 2: LIVE CALENDAR -->
        <section id="view-calendar" class="view-section">
            <h2 class="page-title">Live Calendar</h2>
            <div class="card">
                <div class="calendar-header">
                    <button id="prev-month">&#10094;</button>
                    <h3 id="cal-month-year" style="font-size: 1rem; color: #1e293b;">August 2026</h3>
                    <button id="next-month">&#10095;</button>
                </div>
                <div class="calendar-weekdays">
                    <div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div><div>Su</div>
                </div>
                <div id="calendar-grid" class="calendar-grid">
                    <!-- Populated dynamically by script -->
                </div>
                <div style="display: flex; gap: 15px; margin-top: 16px; font-size: 0.75rem; color: var(--text-muted); justify-content: center;">
                    <span><span style="display:inline-block;width:10px;height:10px;background:var(--primary);border-radius:50%;margin-right:4px;"></span> Period</span>
                    <span><span style="display:inline-block;width:10px;height:10px;background:#e0f2fe;border-radius:50%;margin-right:4px;"></span> Fertile Window</span>
                </div>
            </div>
        </section>

        <!-- VIEW 3: HISTORY -->
        <section id="view-history" class="view-section">
            <h2 class="page-title">Past Logs & Cycles</h2>
            <div class="card" style="padding: 10px; background: transparent; border: none; box-shadow: none;">
                <ul id="history-list" class="history-list">
                    <!-- Populated dynamically by script -->
                </ul>
            </div>
        </section>

    </div>

    <!-- FIXED BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchView('dashboard', this)">
            <span class="icon">🏠</span>
            Dashboard
        </button>
        <button class="nav-item" onclick="switchView('calendar', this)">
            <span class="icon">📅</span>
            Calendar
        </button>
        <button class="nav-item" onclick="switchView('history', this)">
            <span class="icon">🕒</span>
            History
        </button>
    </nav>

    <!-- Custom JavaScript File -->
    <script src="app.js"></script>
</body>
</html>
