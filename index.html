<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle & Wellness Tracker</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #f43f5e;
            --primary-light: #fff1f2;
            --purple: #8b5cf6;
            --purple-light: #f5f3ff;
            --bg-color: #fdf2f4;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px; /* Space for bottom nav */
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }

        /* View Containers */
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }

        h2.page-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1e293b;
        }

        /* Modern Cards */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(244, 63, 94, 0.05);
            margin-bottom: 20px;
            border: 1px solid rgba(244, 63, 94, 0.08);
        }

        /* Dashboard Circular Overview */
        .overview-ring-container {
            text-align: center;
            position: relative;
            padding: 10px 0;
        }

        .phase-badge {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .days-countdown {
            font-size: 2.2rem;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .cycle-subtext {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .stat-box {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 14px;
            text-align: center;
        }

        .stat-box span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stat-box strong {
            font-size: 0.95rem;
            color: var(--text-main);
        }

        /* Quick Interactive Log Styling */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        select, input[type="date"], input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 0.95rem;
            background: #fff;
            color: var(--text-main);
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.1);
        }

        /* Chip Selectors (Interactive Icons) */
        .chip-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            background: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip.selected {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
            transition: opacity 0.2s;
        }

        .btn-primary:active {
            opacity: 0.9;
        }

        /* Calendar Grid Styles */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-header button {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            background: #f1f5f9;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .cal-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: pointer;
            background: #f8fafc;
            position: relative;
        }

        .cal-day.period {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        .cal-day.fertile {
            background: #e0f2fe;
            color: #0369a1;
            font-weight: 600;
        }

        .cal-day.today {
            border: 2px solid var(--primary);
        }

        /* History List Styles */
        .history-list {
            list-style: none;
        }

        .history-item {
            background: white;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .tag {
            background: var(--purple-light);
            color: var(--purple);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 500;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
            border-top: 1px solid var(--border-color);
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item span.icon {
            font-size: 1.3rem;
            margin-bottom: 2px;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- VIEW 1: DASHBOARD -->
        <section id="view-dashboard" class="view-section active">
            <h2 class="page-title">Dashboard</h2>

            <!-- Overview Ring Card -->
            <div class="card">
                <div class="overview-ring-container">
                    <div id="current-phase" class="phase-badge">Loading...</div>
                    <div id="current-day" class="days-countdown">-</div>
                    <div class="cycle-subtext">Current Cycle Status</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <span>Next Period</span>
                        <strong id="next-period-date">-</strong>
                    </div>
                    <div class="stat-box">
                        <span>Fertile Window</span>
                        <strong id="ovulation-window">-</strong>
                    </div>
                </div>
            </div>

            <!-- Daily Wellness Tip -->
            <div id="tips-card" class="card" style="background: var(--purple-light); border-color: rgba(139,92,246,0.15);">
                <h3 style="font-size: 0.95rem; color: var(--purple); margin-bottom: 6px;">💡 Daily Wellness Tip</h3>
                <p id="phase-tips-content" style="font-size: 0.85rem; color: #475569; line-height: 1.4;">Loading tips...</p>
            </div>

            <!-- Quick Logging Form -->
            <div class="card">
                <h3 style="font-size: 1rem; margin-bottom: 14px; color: #1e293b;">Log Today's Update</h3>
                <form id="period-form">
                    <div class="form-group">
                        <label id="date-label">Action / Date</label>
                        <select id="action-type">
                            <option value="daily">📝 Log Daily Check-in (Symptoms & Mood)</option>
                            <option value="start">🩸 Log Period Start Date</option>
                            <option value="end">🏁 Log Period End Date</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Select Date</label>
                        <input type="date" id="single-date" required>
                    </div>

                    <div class="form-group">
                        <label>Flow Intensity</label>
                        <select id="flow-intensity">
                            <option value="">-- None / N/A --</option>
                            <option value="Spotting">Spotting</option>
                            <option value="Light">Light</option>
                            <option value="Normal">Normal</option>
                            <option value="Heavy">Heavy</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Cramps / Body Pain</label>
                        <select id="symptom-severity">
                            <option value="Mild / None">Mild / None</option>
                            <option value="Moderate">Moderate</option>
                            <option value="Severe">Severe</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Mood</label>
                        <select id="mood-select">
                            <option value="Calm & Balanced">Calm & Balanced 🌸</option>
                            <option value="Happy">Happy 😊</option>
                            <option value="Anxious / Stressed">Anxious / Stressed 🌧️</option>
                            <option value="Irritable">Irritable ⚡</option>
                            <option value="Fatigued">Fatigued 😴</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Other Symptoms (comma separated)</label>
                        <input type="text" id="symptoms-input" placeholder="e.g., headache, bloating">
                    </div>

                    <button type="submit" id="submit-btn" class="btn-primary">Save Entry</button>
                </form>
            </div>
        </section>

        <!-- VIEW 2: LIVE CALENDAR -->
        <section id="view-calendar" class="view-section">
            <h2 class="page-title">Live Calendar</h2>
            <div class="card">
                <div class="calendar-header">
                    <button id="prev-month">&#10094;</button>
                    <h3 id="cal-month-year" style="font-size: 1rem; color: #1e293b;">August 2026</h3>
                    <button id="next-month">&#10095;</button>
                </div>
                <div class="calendar-weekdays">
                    <div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div><div>Su</div>
                </div>
                <div id="calendar-grid" class="calendar-grid">
                    <!-- Populated dynamically by script -->
                </div>
                <div style="display: flex; gap: 15px; margin-top: 16px; font-size: 0.75rem; color: var(--text-muted); justify-content: center;">
                    <span><span style="display:inline-block;width:10px;height:10px;background:var(--primary);border-radius:50%;margin-right:4px;"></span> Period</span>
                    <span><span style="display:inline-block;width:10px;height:10px;background:#e0f2fe;border-radius:50%;margin-right:4px;"></span> Fertile Window</span>
                </div>
            </div>
        </section>

        <!-- VIEW 3: HISTORY -->
        <section id="view-history" class="view-section">
            <h2 class="page-title">Past Logs & Cycles</h2>
            <div class="card" style="padding: 10px; background: transparent; border: none; box-shadow: none;">
                <ul id="history-list" class="history-list">
                    <!-- Populated dynamically by script -->
                </ul>
            </div>
        </section>

    </div>

    <!-- FIXED BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchView('dashboard', this)">
            <span class="icon">🏠</span>
            Dashboard
        </button>
        <button class="nav-item" onclick="switchView('calendar', this)">
            <span class="icon">📅</span>
            Calendar
        </button>
        <button class="nav-item" onclick="switchView('history', this)">
            <span class="icon">🕒</span>
            History
        </button>
    </nav>

    <!-- Main JavaScript File -->
    <script src="app.js"></script>
</body>
</html>
