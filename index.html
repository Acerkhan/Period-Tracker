<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle, Mood & Phase Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Cycle Tracker</h1>
        <p>Your Daily Health, Mood & Phase Companion</p>
    </header>

    <!-- Current Overview Panel -->
    <div class="card">
        <h2>Current Overview</h2>
        <div class="status-grid">
            <div class="status-box highlight">
                <div class="status-label">Current Phase</div>
                <div class="status-value" id="current-phase">Loading...</div>
            </div>
            <div class="status-box">
                <div class="status-label">Cycle Day</div>
                <div class="status-value" id="current-day">-</div>
            </div>
            <div class="status-box">
                <div class="status-label">Next Period Expected</div>
                <div class="status-value" id="next-period-date" style="font-size: 1.1rem;">-</div>
            </div>
            <div class="status-box highlight" style="grid-column: span 2;">
                <div class="status-label">Estimated Ovulation Window</div>
                <div class="status-value" id="ovulation-window" style="font-size: 1.1rem; color: #0284c7;">-</div>
            </div>
        </div>
    </div>

    <!-- Phase Tips Panel -->
    <div class="card" id="tips-card" style="display:none;">
        <h2>💡 Daily Wellness Tip</h2>
        <div id="phase-tips-content" style="font-size: 0.95rem; line-height: 1.5; color: var(--text-main);"></div>
    </div>

    <!-- Log Period Entry Form -->
    <div class="card">
        <h2>Log Period Dates & Symptoms</h2>
        <form id="period-form">
            <div class="input-row">
                <div class="input-group">
                    <label for="start-date">Period Start Date</label>
                    <input type="date" id="start-date" required>
                </div>
                <div class="input-group">
                    <label for="end-date">Period End Date</label>
                    <input type="date" id="end-date" required>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="flow-intensity">Flow Intensity</label>
                    <select id="flow-intensity">
                        <option value="Normal">Normal</option>
                        <option value="Light">Light</option>
                        <option value="Heavy">Heavy 🌧️</option>
                        <option value="Spotting">Spotting</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="symptom-severity">Cramps / Body Pain</label>
                    <select id="symptom-severity">
                        <option value="None">Mild / None</option>
                        <option value="Moderate">Moderate</option>
                        <option value="Severe">Severe ⚠️</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="mood-select">How are you feeling today?</label>
                <select id="mood-select">
                    <option value="Calm & Balanced">Calm & Balanced 🌸</option>
                    <option value="Energetic">Energetic ✨</option>
                    <option value="Fatigued / Tired">Fatigued / Tired 🔋</option>
                    <option value="Irritable / Sensitive">Irritable / Sensitive 🌧️</option>
                    <option value="Anxious / Stressed">Anxious / Stressed 🌊</option>
                </select>
            </div>

            <div class="input-group">
                <label for="symptoms-input">Other Symptoms (comma separated)</label>
                <input type="text" id="symptoms-input" placeholder="e.g., headache, bloating">
            </div>

            <button type="submit" id="submit-btn">Save Entry</button>
        </form>
    </div>

    <!-- Past Cycles History -->
    <div class="card">
        <h2>Past Cycles History</h2>
        <ul id="history-list" class="history-list">
            <li class="empty-state">Loading data from Supabase...</li>
        </ul>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
